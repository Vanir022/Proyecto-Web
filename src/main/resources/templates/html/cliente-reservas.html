<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - EDEN RESORTS</title>
      <link rel="icon" type="image/x-icon" href="imagenes/EDEN.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/styleIndex.css}" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5 pt-5">
        <div class="row">
            <div class="col-12">
                <!-- Mensajes de éxito o error -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <h1 class="text-center text-primary mb-5">
                    <i class="fas fa-bed me-2"></i>Reserva tu Habitación
                </h1>
            </div>
        </div>

        <!-- Formulario de búsqueda de habitaciones -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-search me-2"></i>Buscar Habitaciones Disponibles
                        </h4>
                    </div>
                    <div class="card-body">
                        <form action="/reservas/buscar" method="get">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="hotel" class="form-label">Hotel</label>
                                    <select class="form-select" name="hotel" id="hotel">
                                        <option value="">Todos los hoteles</option>
                                        <option th:each="h : ${hoteles}" 
                                                th:value="${h}" 
                                                th:text="${h}"
                                                th:selected="${h == hotel}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="tipo" class="form-label">Tipo de Habitación</label>
                                    <select class="form-select" name="tipo" id="tipo">
                                        <option value="">Todos los tipos</option>
                                        <option value="Standard" th:selected="${tipo == 'Standard'}">Standard</option>
                                        <option value="Superior" th:selected="${tipo == 'Superior'}">Superior</option>
                                        <option value="Suite" th:selected="${tipo == 'Suite'}">Suite</option>
                                        <option value="Master Suite" th:selected="${tipo == 'Master Suite'}">Master Suite</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="fechaEntrada" class="form-label">Fecha de Entrada</label>
                                    <input type="date" class="form-control" name="fechaEntrada" id="fechaEntrada" 
                                           th:value="${fechaEntrada}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="fechaSalida" class="form-label">Fecha de Salida</label>
                                    <input type="date" class="form-control" name="fechaSalida" id="fechaSalida" 
                                           th:value="${fechaSalida}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="capacidad" class="form-label">Huéspedes</label>
                                    <select class="form-select" name="capacidad" id="capacidad">
                                        <option value="">Cualquier capacidad</option>
                                        <option value="1" th:selected="${capacidad == 1}">1 huésped</option>
                                        <option value="2" th:selected="${capacidad == 2}">2 huéspedes</option>
                                        <option value="3" th:selected="${capacidad == 3}">3 huéspedes</option>
                                        <option value="4" th:selected="${capacidad == 4}">4 huéspedes</option>
                                        <option value="5" th:selected="${capacidad == 5}">5 huéspedes</option>
                                        <option value="6" th:selected="${capacidad == 6}">6 huéspedes</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="precioMax" class="form-label">Precio Máximo (S/)</label>
                                    <input type="number" class="form-control" name="precioMax" id="precioMax" 
                                           th:value="${precioMax}" placeholder="Ingresa precio máximo" min="0" step="50">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary btn-lg w-100">
                                        <i class="fas fa-search me-2"></i>Buscar Habitaciones
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mis Reservas (si el usuario está logueado) -->
        <div th:if="${misReservas != null and !misReservas.isEmpty()}" class="row mt-5">
            <div class="col-12">
                <h3 class="text-center mb-4">
                    <i class="fas fa-history me-2"></i>Mis Reservas
                </h3>
                
                <div class="row g-3">
                    <div class="col-lg-4" th:each="reserva : ${misReservas}">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span class="fw-bold" th:text="${reserva.codigoReserva}"></span>
                                <span class="badge" 
                                      th:class="${reserva.estado == 'CONFIRMADA' ? 'bg-success' : (reserva.estado == 'CANCELADA' ? 'bg-danger' : 'bg-warning')}"
                                      th:text="${reserva.estado}">
                                </span>
                            </div>
                            <div class="card-body">
                                <h6 class="text-primary" 
                                    th:text="'Habitación ' + ${reserva.habitacion.numero} + ' - ' + ${reserva.habitacion.hotel}">
                                </h6>
                                <p class="mb-1">
                                    <i class="fas fa-calendar me-1"></i>
                                    <span th:text="${#temporals.format(reserva.fechaEntrada, 'dd/MM/yyyy')}"></span> - 
                                    <span th:text="${#temporals.format(reserva.fechaSalida, 'dd/MM/yyyy')}"></span>
                                </p>
                                <p class="mb-1">
                                    <i class="fas fa-users me-1"></i>
                                    <span th:text="${reserva.numeroHuespedes + ' huéspedes'}"></span>
                                </p>
                                <p class="mb-1" th:if="${reserva.dniCliente}">
                                    <i class="fas fa-id-card me-1"></i>
                                    <span>DNI: </span><span th:text="${reserva.dniCliente}"></span>
                                </p>
                                <p class="mb-3">
                                    <strong>Total: S/ <span th:text="${#numbers.formatDecimal(reserva.montoTotal, 0, 2)}"></span></strong>
                                </p>
                                
                                <div th:if="${reserva.estado == 'CONFIRMADA' || reserva.estado == 'PENDIENTE'}">
                                    <form th:action="@{'/reservas/cancelar/' + ${reserva.id}}" method="post" 
                                          onsubmit="return confirm('¿Estás seguro de cancelar esta reserva?')">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="fas fa-times me-1"></i>Cancelar Reserva
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Información adicional -->
        <div class="row mt-5">
            <div class="col-12">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h5>¿Necesitas ayuda con tu reserva?</h5>
                        <p class="mb-3">Nuestro equipo está disponible para asistirte</p>
                        <div class="row">
                            <div class="col-md-4">
                                <i class="fas fa-phone text-primary"></i>
                                <p class="mb-0"><strong>Teléfono</strong></p>
                                <p>+51 912-345-678</p>
                            </div>
                            <div class="col-md-4">
                                <i class="fas fa-envelope text-primary"></i>
                                <p class="mb-0"><strong>Email</strong></p>
                                <p>reservas@edenresorts.com</p>
                            </div>
                            <div class="col-md-4">
                                <i class="fas fa-clock text-primary"></i>
                                <p class="mb-0"><strong>Atención</strong></p>
                                <p>24 horas / 7 días</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Configurar fechas mínimas
        document.addEventListener('DOMContentLoaded', function() {
            const hoy = new Date().toISOString().split('T')[0];
            const fechaEntrada = document.getElementById('fechaEntrada');
            const fechaSalida = document.getElementById('fechaSalida');
            
            fechaEntrada.min = hoy;
            fechaSalida.min = hoy;
            
            fechaEntrada.addEventListener('change', function() {
                const fechaSeleccionada = new Date(this.value);
                fechaSeleccionada.setDate(fechaSeleccionada.getDate() + 1);
                fechaSalida.min = fechaSeleccionada.toISOString().split('T')[0];
                
                if (fechaSalida.value && new Date(fechaSalida.value) <= new Date(this.value)) {
                    fechaSalida.value = fechaSeleccionada.toISOString().split('T')[0];
                }
            });
        });
    </script>
</body>
</html>
