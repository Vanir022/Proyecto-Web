<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Mensajes - EDEN RESORTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-envelope me-2"></i>Panel de Mensajes de Contacto
                </h1>
                
                <!-- Estadísticas -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card bg-warning text-white">
                            <div class="card-body text-center">
                                <h3 th:text="${nuevos ?: 0}">0</h3>
                                <p>Mensajes Nuevos</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-info text-white">
                            <div class="card-body text-center">
                                <h3 th:text="${leidos ?: 0}">0</h3>
                                <p>Mensajes Leídos</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-success text-white">
                            <div class="card-body text-center">
                                <h3 th:text="${respondidos ?: 0}">0</h3>
                                <p>Mensajes Respondidos</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Lista de mensajes -->
                <div class="card">
                    <div class="card-header">
                        <h4>Todos los Mensajes</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${contactos != null and !contactos.isEmpty()}">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Fecha</th>
                                            <th>Nombre</th>
                                            <th>Email</th>
                                            <th>Hotel</th>
                                            <th>Estado</th>
                                            <th>Mensaje</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="contacto : ${contactos}">
                                            <td th:text="${#temporals.format(contacto.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></td>
                                            <td th:text="${contacto.nombre}"></td>
                                            <td th:text="${contacto.email}"></td>
                                            <td th:text="${contacto.hotel ?: 'No especificado'}"></td>
                                            <td>
                                                <span th:class="${contacto.estado == 'NUEVO' ? 'badge bg-warning' : 
                                                               (contacto.estado == 'LEIDO' ? 'badge bg-info' : 'badge bg-success')}"
                                                      th:text="${contacto.estado}">
                                                </span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm btn-outline-primary" 
                                                        data-bs-toggle="modal" 
                                                        th:data-bs-target="'#modal' + ${contacto.id}">
                                                    Ver mensaje
                                                </button>
                                            </td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button th:if="${contacto.estado == 'NUEVO'}" 
                                                            class="btn btn-info"
                                                            th:onclick="'marcarLeido(' + ${contacto.id} + ')'">
                                                        Marcar Leído
                                                    </button>
                                                    <button th:if="${contacto.estado != 'RESPONDIDO'}" 
                                                            class="btn btn-success"
                                                            th:onclick="'marcarRespondido(' + ${contacto.id} + ')'">
                                                        Respondido
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div th:if="${contactos == null or contactos.isEmpty()}" class="text-center py-4">
                            <p class="text-muted">No hay mensajes de contacto aún.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modales para ver mensajes -->
    <div th:each="contacto : ${contactos}">
        <div class="modal fade" th:id="'modal' + ${contacto.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="'Mensaje de ' + ${contacto.nombre}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Email:</strong> <span th:text="${contacto.email}"></span></p>
                        <p th:if="${contacto.telefono}"><strong>Teléfono:</strong> <span th:text="${contacto.telefono}"></span></p>
                        <p th:if="${contacto.hotel}"><strong>Hotel:</strong> <span th:text="${contacto.hotel}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(contacto.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <hr>
                        <p><strong>Mensaje:</strong></p>
                        <p th:text="${contacto.mensaje}" style="white-space: pre-line;"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function marcarLeido(id) {
            fetch('/contactos/marcar-leido/' + id, {method: 'POST'})
                .then(response => response.text())
                .then(data => {
                    if (data === 'success') {
                        location.reload();
                    } else {
                        alert('Error al actualizar el estado');
                    }
                });
        }
        
        function marcarRespondido(id) {
            fetch('/contactos/marcar-respondido/' + id, {method: 'POST'})
                .then(response => response.text())
                .then(data => {
                    if (data === 'success') {
                        location.reload();
                    } else {
                        alert('Error al actualizar el estado');
                    }
                });
        }
    </script>
</body>
</html>
